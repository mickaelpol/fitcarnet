security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        utilisateurs:
            entity:
                class: App\Entity\Utilisateur
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        connexion:
            pattern: ^/api/connexion$
            stateless: true
            # UN COMPTE DESACTIVE NE PASSE PAS. `actif` existait depuis le
            # debut et personne ne le lisait : « bloquer » un compte etait
            # decoratif. Voir App\Security\CompteActif.
            user_checker: App\Security\CompteActif
            # CINQ ESSAIS PAR QUART D'HEURE, ET C'EST LA SEULE CHOSE QUI
            # SEPARE UN MOT DE PASSE D'UNE LISTE DE FUITES.
            #
            # Il n'y en avait aucune : un script pouvait poster des mots de
            # passe en boucle depuis Internet, sans blocage, sans delai, sans
            # trace exploitable. A cinquante essais par seconde, un mot de
            # passe court tire d'un dictionnaire tombe en quelques heures.
            #
            # LA REGLE DU PROJET A DURCI LE 18 SEPTEMBRE 2026 — douze
            # caracteres, une minuscule, une majuscule, un chiffre, un
            # caractere special (`api/regles/motdepasse.json`). Ce paragraphe
            # disait « la regle n'exige QUE dix caracteres » : ce n'est plus
            # vrai. Ca ne rend PAS cette limitation superflue, au contraire —
            # une composition imposee rend les mots de passe plus previsibles
            # a nombre de caracteres egal, et c'est la limitation des
            # tentatives qui couvre ce que la regle ne couvre pas.
            #
            # Symfony pose deux compteurs : un par couple adresse+IP, un
            # global par IP (cinq fois plus large) qui attrape le balayage de
            # plusieurs comptes depuis la meme source.
            #
            # CINQ ET PAS TROIS : trois bloque quelqu'un qui hesite entre deux
            # de ses mots de passe habituels. Un garde-fou qui gene l'usage
            # normal finit desactive.
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'
            json_login:
                check_path: /api/connexion
                username_path: email
                password_path: motDePasse
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure

        # Prolonger ou terminer une session se fait SANS pare-feu JWT.
        # On appelle ces routes justement quand le jeton d'acces est perime :
        # le pare-feu `api` repondrait 401 avant d'atteindre le controleur des
        # qu'un en-tete Authorization invalide traine dans la requete. Elles
        # s'authentifient par le jeton de rafraichissement, dans le corps.
        # Doit rester AVANT `api` : le premier motif qui correspond gagne.
        session:
            pattern: ^/api/(jeton/rafraichir|deconnexion)$
            security: false

        # ACCEPTER UNE INVITATION SE FAIT SANS COMPTE — c'est tout l'objet.
        # Le jeton de 256 bits dans l'URL tient lieu d'authentification : on
        # ne peut pas le deviner, et il ne sert qu'une fois.
        #
        # AU SINGULIER, ET LA BARRE OBLIQUE FINALE N'EST PAS DECORATIVE :
        # `^/api/invitation/` ne peut pas attraper `/api/invitations`, qui est
        # reserve a l'administrateur — le caractere suivant y est un « s ».
        # Sans cette barre, la liste des invitations et le pouvoir d'en creer
        # deviendraient publics.
        #
        # Doit rester AVANT `api` : le premier motif qui correspond gagne.
        invitation:
            pattern: ^/api/invitation/
            security: false

        # LA PASTILLE VERTE OU ROUGE DE L'ECRAN COMPTE, ET RIEN D'AUTRE.
        #
        # Hors pare-feu pour une raison precise : un jeton perime traine dans
        # l'en-tete Authorization des qu'une session a expire, et le pare-feu
        # `api` repondrait 401 avant d'atteindre le controleur. La pastille
        # dirait alors « hors ligne » sur un serveur en parfaite sante — le
        # contraire de ce qu'on lui demande.
        #
        # Voir `EtatController` : cette route ne rend rien qu'on ne puisse
        # offrir au premier venu.
        etat:
            pattern: ^/api/etat$
            security: false

        api:
            pattern: ^/api
            stateless: true
            provider: utilisateurs
            jwt: ~
            # Verifie a CHAQUE requete portant un jeton : un compte desactive
            # pendant qu'il est connecte perd l'acces des la requete suivante,
            # pas a l'expiration de son jeton une heure plus tard.
            user_checker: App\Security\CompteActif

        main:
            lazy: true
            provider: utilisateurs

    access_control:
        # QUATRE DE CES LIGNES SONT DECORATIVES, ET IL FAUT LE DIRE — releve le
        # 18 septembre 2026 en confrontant la configuration a la documentation
        # Symfony 7.4.
        #
        # Quand un pare-feu est en `security: false`, AUCUN ecouteur de
        # securite n'est instancie — donc `access_control` n'est pas evalue non
        # plus. Les lignes de `jeton/rafraichir`, `deconnexion`,
        # `invitation/` et `etat` se lisent comme un filet de securite et n'en
        # sont pas un : ce sont leurs pare-feux qui ouvrent, elles ne font que
        # le repeter. On les garde parce qu'elles disent l'intention au meme
        # endroit que les autres, et qu'un jour ou l'un de ces pare-feux
        # cesserait d'etre `security: false`, elles redeviendraient vivantes et
        # justes. Mais personne ne doit croire qu'elles protegent aujourd'hui.
        #
        # Seule `^/api/connexion` compte vraiment ici : son pare-feu a bien la
        # securite activee (`json_login` + `login_throttling`).
        - { path: ^/api/connexion, roles: PUBLIC_ACCESS }
        - { path: ^/api/jeton/rafraichir, roles: PUBLIC_ACCESS }
        - { path: ^/api/deconnexion, roles: PUBLIC_ACCESS }
        # Au singulier, avec la barre finale. Voir le pare-feu `invitation`.
        - { path: ^/api/invitation/, roles: PUBLIC_ACCESS }
        - { path: ^/api/etat$, roles: PUBLIC_ACCESS }
        # LA DOCUMENTATION N'EST PAS PUBLIQUE, ET LA RACINE NON PLUS.
        #
        # Les deux etaient ouvertes a tous. `/api/docs` sert la description
        # complete de l'API — chaque ressource, chaque champ, chaque verbe —
        # et `/api` en liste les points d'entree. Aucune donnee ne fuyait, mais
        # n'importe qui obtenait la carte de l'application en une requete, ce
        # qui est exactement ce dont on a besoin pour en chercher les portes.
        #
        # La documentation reste utile a celui qui developpe : elle passe donc
        # a ROLE_ADMIN plutot que d'etre supprimee.
        - { path: ^/api/docs, roles: ROLE_ADMIN }
        - { path: ^/api$, roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
