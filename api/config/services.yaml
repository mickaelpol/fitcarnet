parameters:
    off_user_agent: '%env(default::OFF_USER_AGENT)%'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    # Garde-fou : restreint toute collection « ProprieteUtilisateur »
    # a l'utilisateur connecte.
    App\Doctrine\FiltreProprietaire:
        tags:
            - { name: api_platform.doctrine.orm.query_extension.collection, priority: 100 }
            - { name: api_platform.doctrine.orm.query_extension.item, priority: 100 }

    # Catalogue d'exercices : « public OU le mien ». La règle porte sur
    # `public` et non sur l'absence d'auteur — un administrateur peut ainsi
    # publier l'exercice de quelqu'un sans en effacer la paternité.
    # Constat E8 : `creePar` existait depuis l'origine sans jamais être
    # renseigné, pendant que l'écran affichait « ★ exercice personnel ».
    App\Doctrine\FiltreExercice:
        tags:
            - { name: api_platform.doctrine.orm.query_extension.collection, priority: 100 }
            - { name: api_platform.doctrine.orm.query_extension.item, priority: 100 }

    # Une séance est lue en un seul objet : elle doit être chargée en une seule
    # requête. Sans ça, sérialiser ses collections paresseuses en déclenchait
    # près de deux cents par écran. Voir App\Doctrine\ChargementComplet.
    #
    # Priorité plus basse que les garde-fous ci-dessus : ils posent le WHERE,
    # celui-ci se contente d'ajouter des jointures par-dessus.
    App\Doctrine\ChargementComplet:
        tags:
            - { name: api_platform.doctrine.orm.query_extension.collection, priority: 50 }
            - { name: api_platform.doctrine.orm.query_extension.item, priority: 50 }

    # Une colonne DECIMAL s'écrit en nombre comme en chaîne.
    #
    # `POST /api/aliments {"kcal100": 350}` répondait 400 le 16 septembre 2026 :
    # Doctrine hydrate un DECIMAL en chaîne (décision du projet — pas de virgule
    # flottante sur des valeurs nutritionnelles), et `property_info` en déduisait
    # que l'API attendait « 350 ». Cette fabrique repasse derrière et déclare
    # `float|string`, ce que les mutateurs acceptent déjà.
    #
    # Priorité 0 : à l'intérieur du cache (-10), donc calculée une fois, et par
    # dessus les fabriques d'API Platform (property_info 40, attribute 35) dont
    # elle corrige le résultat.
    App\Metadata\DecimalesNumeriques:
        decorates: 'api_platform.metadata.property.metadata_factory'
        decoration_priority: 0
        arguments: ['@.inner']

    # Grocy : la base d'aliments de l'administrateur.
    # Les identifiants viennent de l'environnement, jamais du dépôt.
    App\Service\FrigoGrocy:
        arguments:
            $url: '%env(default::GROCY_URL)%'
            $cle: '%env(default::GROCY_API_KEY)%'
