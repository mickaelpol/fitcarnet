# =====================================================================
#  fitcarnet — environnement de DÉVELOPPEMENT (WSL2 / PhpStorm)
#  Lancer depuis la racine du dépôt :  docker compose -f compose.dev.yml up -d
#  Chemins RELATIFS : le dépôt est cloné où tu veux dans WSL.
# =====================================================================
services:

  db:
    image: postgres:16-alpine
    container_name: fitcarnet-db-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: fitcarnet
      POSTGRES_USER: fitcarnet
      POSTGRES_PASSWORD: fitcarnet          # local uniquement, jamais en prod
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitcarnet -d fitcarnet"]
      interval: 5s
      timeout: 3s
      retries: 10
    # ---------------------------------------------------------------------
    #  LE PORT 5432 EST PUBLIÉ, ET C'EST UNE DÉCISION — constat 02#15,
    #  tranché le 18 septembre 2026 : gardé tel quel, et écrit ici pour qu'on
    #  ne le redécouvre pas comme un oubli.
    #
    #  POURQUOI IL RESTE : il sert. `import_carnet.py` et `import_catalogue.py`
    #  visent `localhost:5432` depuis WSL, hors conteneur ; PhpStorm → Database
    #  aussi. Le fermer casserait ces trois usages quotidiens pour ne rien
    #  protéger de plus.
    #
    #  POURQUOI CE N'EST PAS LE MÊME SUJET QU'EN PRODUCTION : là-bas, le bloc
    #  `ports:` de la base a été RETIRÉ (voir `docker-compose.yml`), parce que
    #  le NAS est joignable depuis Internet et que publier un port, c'est
    #  l'ouvrir au monde. Ici, la base contient des données de développement,
    #  le mot de passe est `fitcarnet` en clair deux lignes plus haut, et
    #  Docker Desktop sous WSL2 lie ce port à l'interface de la machine
    #  locale. Le risque réel est un autre poste du réseau domestique — pas
    #  Internet.
    #
    #  CE QUI FERAIT CHANGER D'AVIS : le jour où cette base porterait une copie
    #  de production (une restauration pour enquêter sur un bug, par exemple),
    #  ce port devient une vraie exposition. Dans ce cas, le lier explicitement
    #  à la boucle locale — `127.0.0.1:5432:5432` — et non le laisser sur
    #  toutes les interfaces.
    # ---------------------------------------------------------------------
    ports:
      - "5432:5432"

  app:
    build:
      context: ./docker
      dockerfile: Dockerfile
      target: dev
    container_name: fitcarnet-app-dev
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SERVER_NAME: ":80"
      APP_ENV: dev
      APP_SECRET: dev_secret_local_seulement
      GROCY_URL: ${GROCY_URL:-}
      GROCY_API_KEY: ${GROCY_API_KEY:-}
      DATABASE_URL: "postgresql://fitcarnet:fitcarnet@db:5432/fitcarnet?serverVersion=16&charset=utf8"
      JWT_PASSPHRASE: dev_passphrase_locale
      CORS_ALLOW_ORIGIN: '^https?://(localhost|127\.0\.0\.1)(:[0-9]+)?$$'
      OFF_USER_AGENT: "fitcarnet-dev/1.0 (contact@mickael-pol.fr)"
      TZ: Europe/Paris
      # indispensable pour que PhpStorm reconnaisse le serveur Xdebug
      PHP_IDE_CONFIG: "serverName=fitcarnet"
    extra_hosts:
      - "host.docker.internal:host-gateway"   # WSL2 : permet à Xdebug de joindre PhpStorm
    ports:
      - "8080:80"
    volumes:
      - ./api:/app
      - ./docker/Caddyfile:/etc/frankenphp/Caddyfile:ro

volumes:
  pgdata_dev:
