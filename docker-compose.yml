# =====================================================================
#  fitcarnet — stack de PRODUCTION, deployee par Portainer depuis Gitea.
#
#  LES CHEMINS SONT ABSOLUS, ET J'AI ESSAYE LE CONTRAIRE.
#
#  J'avais mis des chemins relatifs — `./api`, `./db` — en comptant sur
#  Portainer pour cloner le depot et les resoudre dans son clone. Ca ne marche
#  PAS en Portainer CE : `/data/compose/<id>/` est un chemin a l'interieur du
#  conteneur Portainer, que le demon Docker du NAS ne voit pas. Le deploiement
#  echoue sur « Bind mount failed: '/data/compose/45/db' does not exist ».
#  Resoudre les chemins relatifs d'une stack Git est une fonction de l'edition
#  Business.
#
#  Le code arrive donc sur le NAS par un VRAI clone git, a un endroit fixe, et
#  `deployer-nas.sh` le met a jour. Voir DEPLOIEMENT.md.
#
#  /volume1/docker/fitcarnet/ contient :
#    api/ db/ docker/ front/   le clone, mis a jour par git pull
#    pgdata/                   les donnees PostgreSQL, HORS du depot
#    telecharger/              l'APK et son version.json, HORS du depot
# =====================================================================
services:

  fitcarnet-db:
    image: postgres:16-alpine
    container_name: fitcarnet-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: fitcarnet
      POSTGRES_USER: fitcarnet
      POSTGRES_PASSWORD: ${DB_PASSWORD:?definis DB_PASSWORD dans les variables de la stack}
    volumes:
      - /volume1/docker/fitcarnet/pgdata:/var/lib/postgresql/data
      # Joues UNE SEULE FOIS, a la creation du volume. Sur une base qui
      # existe deja, PostgreSQL les ignore : c'est le point d'entree du
      # conteneur applicatif qui joue `db/manuel/` a chaque demarrage.
      - /volume1/docker/fitcarnet/db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitcarnet -d fitcarnet"]
      interval: 10s
      timeout: 5s
      retries: 5
    # PAS DE `ports:` ICI, ET C'EST DELIBERE.
    #
    # La base etait publiee sur `5433` du NAS « pour les outils d'admin ». Le
    # NAS est joignable depuis Internet — c'est ce qui fait marcher
    # l'application —, donc la base l'etait aussi. Qui atteint ce port n'a
    # plus aucun controle applicatif a franchir : ni pare-feu Symfony, ni
    # filtre de proprietaire. Il lit tous les carnets, toutes les empreintes
    # de mots de passe et de jetons. La seule barriere etait `DB_PASSWORD`,
    # sans limitation de tentatives.
    #
    # `fitcarnet-app` la joint par le reseau interne de la stack, qui ne sort
    # pas du NAS. Pour une session psql d'administration :
    #
    #     docker exec -it fitcarnet-db psql -U fitcarnet -d fitcarnet
    #
    # Pour un outil graphique depuis ton poste, un tunnel SSH plutot qu'un
    # port ouvert :
    #
    #     ssh -L 5433:127.0.0.1:5433 root@nas   (apres avoir remis ce bloc)

  # FrankenPHP : un seul service pour l'API Symfony ET le front React
  fitcarnet-app:
    build:
      context: /volume1/docker/fitcarnet/docker
      dockerfile: Dockerfile
      target: prod                     # passe a "dev" pour le rechargement a chaud
    container_name: fitcarnet-app
    restart: unless-stopped
    # PAS DE `extra_hosts` ICI, ET C'EST UN CONSTAT, PAS UN OUBLI.
    #
    # Grocy tourne sur le meme NAS, dans une autre pile. `GROCY_URL` pointe
    # vers son adresse PUBLIQUE : chaque appel sort du NAS, resout un nom DNS
    # public, refait une poignee de main TLS et retraverse le proxy inverse —
    # pour atteindre une application situee a quelques centimetres. Cinq appels
    # a chaque ouverture du frigo.
    #
    # On a essaye de raccourcir ce chemin, le 12 aout 2026 :
    #
    #   - `host.docker.internal:host-gateway` : le nom se resout bien, mais
    #     vers 172.17.0.1 — la passerelle du reseau `bridge` PAR DEFAUT, que ce
    #     conteneur-ci ne route pas. Injoignable.
    #   - brancher ce conteneur sur `grocy_default` et appeler `http://grocy` :
    #     plus lent que l'adresse publique.
    #   - passer par la passerelle du reseau, `172.29.0.1:9283` : 26 ms sur une
    #     serie, 1,3 s sur la suivante.
    #
    # LA MESURE ELLE-MEME N'ETAIT PAS FIABLE : le meme appel sur le meme chemin
    # a donne 0,026 s puis 1,301 s a une demi-heure d'ecart. Un facteur 50 de
    # bruit, pour un gain espere bien plus petit. Rien n'a donc ete change.
    #
    # A REPRENDRE UN JOUR OU LE NAS EST AU REPOS : dix mesures alternees des
    # deux chemins, `uptime` releve en meme temps. Pas trois mesures dans une
    # fenetre favorable — c'est ainsi qu'on conclut a l'envers.
    depends_on:
      fitcarnet-db:
        condition: service_healthy
    environment:
      SERVER_NAME: ":80"
      APP_ENV: prod
      APP_SECRET: ${APP_SECRET:?definis APP_SECRET dans les variables de la stack}
      GROCY_URL: ${GROCY_URL:-}
      GROCY_API_KEY: ${GROCY_API_KEY:-}
      DATABASE_URL: "postgresql://fitcarnet:${DB_PASSWORD}@fitcarnet-db:5432/fitcarnet?serverVersion=16&charset=utf8"
      JWT_PASSPHRASE: ${JWT_PASSPHRASE:?definis JWT_PASSPHRASE dans les variables de la stack}
      CORS_ALLOW_ORIGIN: '^https?://(carnet\.mickael-pol\.fr|localhost:5173)$$'
      # L'adresse sous laquelle Symfony fabrique les URL absolues quand aucune
      # requete HTTP ne le renseigne : commandes en console, chauffe du cache
      # au demarrage. `config/packages/routing.yaml` l'exige SANS valeur par
      # defaut — sans elle, `cache:clear` s'arrete sur « Environment variable
      # not found: "DEFAULT_URI" » et le conteneur ne demarre jamais.
      #
      # Elle vivait dans `api/.env`, qui est ignore par git et n'arrive donc
      # pas sur le NAS. Sa place est ici : c'est une valeur de production, pas
      # un secret, et elle doit etre lisible a cote de CORS_ALLOW_ORIGIN qui
      # nomme deja le meme domaine.
      DEFAULT_URI: "https://carnet.mickael-pol.fr"
      # Open Food Facts demande un User-Agent identifiant l'application
      OFF_USER_AGENT: "fitcarnet/1.0 (contact@mickael-pol.fr)"
      TZ: Europe/Paris
    ports:
      - "8094:80"
    volumes:
      - /volume1/docker/fitcarnet/api:/app                       # code Symfony
      # `db/` sert DEUX fois : a l'initialisation de PostgreSQL ci-dessus, et
      # ici pour que le point d'entree puisse jouer `db/manuel/` au demarrage.
      - /volume1/docker/fitcarnet/db:/app/db:ro
      # Construit dans WSL avant le push : l'image de production n'a pas Node,
      # et l'y ajouter pour un build statique serait payer un compilateur a
      # chaque demarrage.
      - /volume1/docker/fitcarnet/front/dist:/app/front:ro
      - /volume1/docker/fitcarnet/docker/Caddyfile:/etc/frankenphp/Caddyfile:ro
      # L'APK Android et son `version.json`. HORS du depot, sur le disque du
      # NAS : un APK pese des dizaines de megaoctets et git n'a rien a en
      # faire. C'est le seul dossier que tu alimentes a la main, quelques fois
      # par an, quand le code natif a bouge.
      - /volume1/docker/fitcarnet/telecharger:/telecharger:ro
      - fitcarnet_caddy_data:/data
      - fitcarnet_caddy_config:/config

volumes:
  fitcarnet_caddy_data:
  fitcarnet_caddy_config:
