# =====================================================================
#  fitcarnet — stack de PRODUCTION, deployee par Portainer depuis Gitea.
#
#  LES CHEMINS SONT ABSOLUS, ET J'AI ESSAYE LE CONTRAIRE.
#
#  J'avais mis des chemins relatifs — `./api`, `./db` — en comptant sur
#  Portainer pour cloner le depot et les resoudre dans son clone. Ca ne marche
#  PAS en Portainer CE : `/data/compose/<id>/` est un chemin a l'interieur du
#  conteneur Portainer, que le demon Docker du NAS ne voit pas. Le deploiement
#  echoue sur « Bind mount failed: '/data/compose/45/db' does not exist ».
#  Resoudre les chemins relatifs d'une stack Git est une fonction de l'edition
#  Business.
#
#  Le code arrive donc sur le NAS par un VRAI clone git, a un endroit fixe, et
#  `deployer-nas.sh` le met a jour. Voir DEPLOIEMENT.md.
#
#  /volume1/docker/fitcarnet/ contient :
#    api/ db/ docker/ front/   le clone, mis a jour par git pull
#    pgdata/                   les donnees PostgreSQL, HORS du depot
#    telecharger/              l'APK et son version.json, HORS du depot
# =====================================================================
services:

  fitcarnet-db:
    image: postgres:16-alpine
    container_name: fitcarnet-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: fitcarnet
      POSTGRES_USER: fitcarnet
      POSTGRES_PASSWORD: ${DB_PASSWORD:?definis DB_PASSWORD dans les variables de la stack}
    volumes:
      - /volume1/docker/fitcarnet/pgdata:/var/lib/postgresql/data
      # Joues UNE SEULE FOIS, a la creation du volume. Sur une base qui
      # existe deja, PostgreSQL les ignore : c'est le point d'entree du
      # conteneur applicatif qui joue `db/manuel/` a chaque demarrage.
      - /volume1/docker/fitcarnet/db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitcarnet -d fitcarnet"]
      interval: 10s
      timeout: 5s
      retries: 5
    # PAS DE `ports:` ICI, ET C'EST DELIBERE.
    #
    # La base etait publiee sur `5433` du NAS « pour les outils d'admin ». Le
    # NAS est joignable depuis Internet — c'est ce qui fait marcher
    # l'application —, donc la base l'etait aussi. Qui atteint ce port n'a
    # plus aucun controle applicatif a franchir : ni pare-feu Symfony, ni
    # filtre de proprietaire. Il lit tous les carnets, toutes les empreintes
    # de mots de passe et de jetons. La seule barriere etait `DB_PASSWORD`,
    # sans limitation de tentatives.
    #
    # `fitcarnet-app` la joint par le reseau interne de la stack, qui ne sort
    # pas du NAS. Pour une session psql d'administration :
    #
    #     docker exec -it fitcarnet-db psql -U fitcarnet -d fitcarnet
    #
    # Pour un outil graphique depuis ton poste, un tunnel SSH plutot qu'un
    # port ouvert :
    #
    #     ssh -L 5433:127.0.0.1:5433 root@nas   (apres avoir remis ce bloc)

  # FrankenPHP : un seul service pour l'API Symfony ET le front React
  fitcarnet-app:
    build:
      context: /volume1/docker/fitcarnet/docker
      dockerfile: Dockerfile
      target: prod                     # passe a "dev" pour le rechargement a chaud
    container_name: fitcarnet-app
    restart: unless-stopped
    # PAS DE `extra_hosts` ICI, ET C'EST UN CONSTAT, PAS UN OUBLI.
    #
    # Grocy tourne sur le meme NAS, dans une autre pile. `GROCY_URL` pointe
    # vers son adresse PUBLIQUE : chaque appel sort du NAS, resout un nom DNS
    # public, refait une poignee de main TLS et retraverse le proxy inverse —
    # pour atteindre une application situee a quelques centimetres. Cinq appels
    # a chaque ouverture du frigo.
    #
    # On a essaye de raccourcir ce chemin, le 12 aout 2026 :
    #
    #   - `host.docker.internal:host-gateway` : le nom se resout bien, mais
    #     vers 172.17.0.1 — la passerelle du reseau `bridge` PAR DEFAUT, que ce
    #     conteneur-ci ne route pas. Injoignable.
    #   - brancher ce conteneur sur `grocy_default` et appeler `http://grocy` :
    #     plus lent que l'adresse publique.
    #   - passer par la passerelle du reseau, `172.29.0.1:9283` : 26 ms sur une
    #     serie, 1,3 s sur la suivante.
    #
    # LA MESURE ELLE-MEME N'ETAIT PAS FIABLE : le meme appel sur le meme chemin
    # a donne 0,026 s puis 1,301 s a une demi-heure d'ecart. Un facteur 50 de
    # bruit, pour un gain espere bien plus petit. Rien n'a donc ete change.
    #
    # A REPRENDRE UN JOUR OU LE NAS EST AU REPOS : dix mesures alternees des
    # deux chemins, `uptime` releve en meme temps. Pas trois mesures dans une
    # fenetre favorable — c'est ainsi qu'on conclut a l'envers.
    depends_on:
      fitcarnet-db:
        condition: service_healthy
    environment:
      SERVER_NAME: ":80"
      APP_ENV: prod
      APP_SECRET: ${APP_SECRET:?definis APP_SECRET dans les variables de la stack}
      GROCY_URL: ${GROCY_URL:-}
      GROCY_API_KEY: ${GROCY_API_KEY:-}
      DATABASE_URL: "postgresql://fitcarnet:${DB_PASSWORD}@fitcarnet-db:5432/fitcarnet?serverVersion=16&charset=utf8"
      JWT_PASSPHRASE: ${JWT_PASSPHRASE:?definis JWT_PASSPHRASE dans les variables de la stack}
      # HTTPS SEUL, ET LE SEUL DOMAINE DE PRODUCTION (constat F-02, 7 sept. 2026).
      #
      # Le motif etait '^https?://(carnet\.mickael-pol\.fr|localhost:5173)$$' :
      # le `?` acceptait `http://` sur le domaine de production, et
      # `localhost:5173` laissait un poste de developpement appeler l'API du
      # NAS depuis un navigateur. `localhost:5173` est le port de Vite — un
      # outil que ce projet n'utilise pas : la ligne a ete recopiee d'ailleurs
      # et personne ne s'en est jamais servi.
      #
      # L'exposition etait faible et le reste : l'authentification passe par
      # l'en-tete `Authorization` et non par un cookie, et
      # `nelmio_cors.yaml` n'active pas `allow_credentials`. CORS n'est donc
      # pas la frontiere qui protege les donnees. Mais un motif qui autorise
      # plus que necessaire finit par etre recopie la ou il compte.
      #
      # Le developpement garde son propre motif, dans `compose.dev.yml` :
      # `^https?://(localhost|127\.0\.0\.1)(:[0-9]+)?$$`. Les deux fichiers
      # sont distincts, il n'y a rien a partager entre eux.
      #
      # `$$` et non `$` : docker compose interprete `$` comme une
      # substitution de variable, `$$` lui fait passer un `$` litteral —
      # celui de la fin d'ancrage de l'expression reguliere.
      CORS_ALLOW_ORIGIN: '^https://carnet\.mickael-pol\.fr$$'
      # L'adresse sous laquelle Symfony fabrique les URL absolues quand aucune
      # requete HTTP ne le renseigne : commandes en console, chauffe du cache
      # au demarrage. `config/packages/routing.yaml` l'exige SANS valeur par
      # defaut — sans elle, `cache:clear` s'arrete sur « Environment variable
      # not found: "DEFAULT_URI" » et le conteneur ne demarre jamais.
      #
      # Elle vivait dans `api/.env`, qui est ignore par git et n'arrive donc
      # pas sur le NAS. Sa place est ici : c'est une valeur de production, pas
      # un secret, et elle doit etre lisible a cote de CORS_ALLOW_ORIGIN qui
      # nomme deja le meme domaine.
      DEFAULT_URI: "https://carnet.mickael-pol.fr"
      # Open Food Facts demande un User-Agent identifiant l'application
      OFF_USER_AGENT: "fitcarnet/1.0 (contact@mickael-pol.fr)"
      TZ: Europe/Paris
    ports:
      - "8094:80"
    volumes:
      - /volume1/docker/fitcarnet/api:/app                       # code Symfony
      # `db/` sert DEUX fois : a l'initialisation de PostgreSQL ci-dessus, et
      # ici pour que le point d'entree puisse jouer `db/manuel/` au demarrage.
      - /volume1/docker/fitcarnet/db:/app/db:ro
      # Construit dans WSL avant le push : l'image de production n'a pas Node,
      # et l'y ajouter pour un build statique serait payer un compilateur a
      # chaque demarrage.
      - /volume1/docker/fitcarnet/front/dist:/app/front:ro
      - /volume1/docker/fitcarnet/docker/Caddyfile:/etc/frankenphp/Caddyfile:ro
      # L'APK Android et son `version.json`. HORS du depot, sur le disque du
      # NAS : un APK pese des dizaines de megaoctets et git n'a rien a en
      # faire. C'est le seul dossier que tu alimentes a la main, quelques fois
      # par an, quand le code natif a bouge.
      - /volume1/docker/fitcarnet/telecharger:/telecharger:ro
      - fitcarnet_caddy_data:/data
      - fitcarnet_caddy_config:/config
    # AJOUTE POUR QUE `fitcarnet-taches` SACHE QUAND DEMARRER, et utile en soi.
    #
    # Le point d'entree fait tout le rituel — composer install, cles JWT,
    # db/manuel/, chauffe du cache — AVANT le `exec` qui lance FrankenPHP. Le
    # port qui ecoute est donc la preuve que ce rituel est fini : c'est
    # exactement la garantie dont le conteneur de taches a besoin avant de
    # toucher a la base.
    #
    # `fsockopen` et pas `curl` : cette image n'embarque pas curl, elle a php.
    # On ne demande rien de plus qu'une connexion — une reponse 401 ou 404
    # prouverait tout aussi bien que l'application repond, et dependre d'une
    # route precise ferait dependre le demarrage d'un detail de routage.
    healthcheck:
      # Le delai de 2 s est explicite : sans lui, `fsockopen` attendrait
      # `default_socket_timeout`, soit 60 s — six fois le `timeout` ci-dessous.
      # Docker tuerait la sonde avant qu'elle ne conclue, a chaque fois.
      test: ["CMD-SHELL", "php -r '$$e=0;$$m=\"\";exit(@fsockopen(\"127.0.0.1\", 80, $$e, $$m, 2) ? 0 : 1);'"]
      interval: 15s
      timeout: 5s
      retries: 20
      # Large : au premier demarrage apres un changement de composer.lock, le
      # point d'entree installe les dependances avant d'ouvrir le port.
      start_period: 180s

  # ---------------------------------------------------------------------
  #  Les travaux qui ne tiennent pas dans une requete HTTP.
  #
  #  AUJOURD'HUI, UN SEUL : appliquer un inventaire.
  #
  #  Il vivait dans la requete. Le 14 aout 2026, PHP s'est arrete a 30 s au
  #  milieu d'un inventaire de quarante lignes pendant que Grocy continuait
  #  d'appliquer ce qu'il avait deja recu : le frigo est reste a moitie
  #  corrige, et rien ne le disait. Grocy tourne avec CINQ ouvriers PHP et une
  #  base SQLite mono-ecrivain — les corrections font la queue quoi qu'on
  #  fasse. Une minute de travail ne rentre pas dans une requete, et l'y forcer
  #  ne la raccourcit pas : ca rend seulement son echec illisible.
  #
  #  MEME BLOC `build` QUE CI-DESSUS, ET C'EST VOULU. Docker reconnait un
  #  contexte et une cible identiques : la seconde construction ne refait rien,
  #  elle retrouve ses couches en cache. Passer par `image:` supposerait que
  #  l'image soit deja construite et etiquetee au moment ou Portainer monte la
  #  pile — une dependance implicite qui casse le jour ou on deploie autrement.
  #
  #  PAS DE `ports:`, PAS DE VOLUME `front/` NI `telecharger/` : ce conteneur
  #  ne repond a personne. Il lit la file, il pousse vers Grocy.
  # ---------------------------------------------------------------------
  fitcarnet-taches:
    build:
      context: /volume1/docker/fitcarnet/docker
      dockerfile: Dockerfile
      target: prod
    # PAS DE `container_name` ICI, ET C'EST LA CONDITION DU `replicas` DESSOUS :
    # un nom fixe ne peut designer qu'un conteneur. Docker les nommera
    # `fitcarnet-taches-1` et `fitcarnet-taches-2`.
    restart: unless-stopped
    deploy:
      # DEUX, ET LE CHIFFRE SE DEMONTRE — IL N'EST PAS PRUDENTIEL.
      #
      # Un lot « base » ecrit dans PostgreSQL en local : une cinquantaine
      # d'UPDATE, de l'ordre de 200 ms. Un lot « grocy » parle a Grocy par HTTP :
      # une a deux secondes PAR LIGNE, soit une minute pour quarante lignes.
      # Trois cents fois plus lent.
      #
      # Avec un seul travailleur, l'utilisateur qui depose 200 ms de travail
      # juste apres un inventaire Grocy attend une minute. Ce n'est pas une
      # question de charge — ca arrive au deuxieme utilisateur.
      #
      # IL NE PEUT Y AVOIR QU'UN SEUL LOT LENT A LA FOIS : `GROCY_URL` designe
      # une instance unique, un seul compte porte `source_frigo = 'grocy'`, et
      # un index unique partiel n'autorise qu'un lot actif par compte. Un
      # travailleur absorbe donc le lot lent, l'autre ecoule tous les rapides.
      #
      # LA REGLE, SI ELLE CHANGE : autant de travailleurs que de comptes
      # « grocy », plus un. Passer un second compte sur Grocy sans monter ce
      # chiffre ramenerait exactement le probleme qu'on corrige ici.
      replicas: 2
    depends_on:
      # `service_healthy`, pas `service_started` : le point d'entree de
      # `fitcarnet-app` est le seul a jouer `db/manuel/` et `composer install`.
      # Demarrer avant lui, c'est chercher une table qui n'existe pas encore
      # dans un vendor/ a moitie ecrit.
      fitcarnet-app:
        condition: service_healthy
    environment:
      APP_ENV: prod
      APP_SECRET: ${APP_SECRET:?definis APP_SECRET dans les variables de la stack}
      GROCY_URL: ${GROCY_URL:-}
      GROCY_API_KEY: ${GROCY_API_KEY:-}
      DATABASE_URL: "postgresql://fitcarnet:${DB_PASSWORD}@fitcarnet-db:5432/fitcarnet?serverVersion=16&charset=utf8"
      JWT_PASSPHRASE: ${JWT_PASSPHRASE:?definis JWT_PASSPHRASE dans les variables de la stack}
      DEFAULT_URI: "https://carnet.mickael-pol.fr"
      OFF_USER_AGENT: "fitcarnet/1.0 (contact@mickael-pol.fr)"
      TZ: Europe/Paris
    volumes:
      - /volume1/docker/fitcarnet/api:/app
      - /volume1/docker/fitcarnet/db:/app/db:ro
    # ON COURT-CIRCUITE `entrypoint-prod`, ET IL LE FAUT.
    #
    # Il installe les dependances, joue les migrations et chauffe le cache —
    # sur le MEME /app monte que `fitcarnet-app`. Deux processus faisant cela
    # en meme temps sur les memes fichiers, c'est une corruption qu'on ne
    # saura pas reproduire a la demande. `fitcarnet-app` prepare, les
    # travailleurs se contentent de travailler.
    entrypoint: ["php"]
    command: ["bin/console", "app:inventaire:traiter", "--boucle"]
    # PAS DE SONDE DE SANTE SUR CE CONTENEUR, ET IL FAUT LE DIRE EXPLICITEMENT.
    #
    # L'image en porte une, heritee de FrankenPHP : elle verifie qu'un serveur
    # web repond. Ce conteneur-ci ne lance pas de serveur, il lance
    # `php bin/console` — il n'y a aucun port a sonder. Les deux travailleurs
    # etaient donc marques `unhealthy` en permanence, alors qu'ils tournaient
    # parfaitement.
    #
    # Rien n'en dependait, ils continuaient de travailler. Le cout est
    # ailleurs : un `docker ps` qui affiche « unhealthy » en temps normal
    # n'apprend plus rien le jour ou quelque chose casse vraiment. Un
    # indicateur qui crie toujours ne signale plus rien.
    #
    # Ecrire une sonde qui verifie que le travailleur travaille serait
    # possible — regarder `vu_le` en base — mais ce serait inventer un besoin :
    # personne ne redemarre ce conteneur automatiquement, et un lot abandonne
    # est deja repris tout seul au bout de deux minutes.
    healthcheck:
      disable: true

volumes:
  fitcarnet_caddy_data:
  fitcarnet_caddy_config:
